<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MerryShop | Online Shopping</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">Merry<span>Shop.</span></div>

      <nav>
        <a href="#home">Home</a>
        <a href="#categories">Categories</a>
        <a href="contact.html">Contact</a>
        <a href="product.html" class="product-btn"> View Product </a>
        <a href="cart.html" class="cart-button">
          🛒 Cart (<span id="cart-count">0</span>)
        </a>
      </nav>

      <button class="cart-btn" onclick="showCart()">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
    </header>

    <section class="hero" id="home">
      <div class="hero-content">
        <h1>Find Everything<br />You Love.</h1>
        <p>Discover amazing products at affordable prices.</p>
        <a href="#products" class="shop-btn">Shop Now</a>
      </div>
    </section>

    <section class="categories" id="categories">
      <h2>Shop by Category</h2>

      <div class="category-list">
        <button onclick="filterProducts('All')">All Products</button>

        <button onclick="filterProducts('Household')">🧺 Household</button>

        <button onclick="filterProducts('Eggs')">🥚 Eggs</button>

        <button onclick="filterProducts('Snacks')">🍫 Snacks</button>

        <button onclick="filterProducts('Personal Care')">
          🧴 Personal Care
        </button>

        <button onclick="filterProducts('Cooking Essentials')">
          🛢️ Cooking Essentials
        </button>
      </div>
    </section>

    <section class="products" id="products">
      <h2>Our Products</h2>

      <div class="product-grid" id="product-list"></div>
    </section>

    <section class="contact" id="contact">
      <h2>Contact Us</h2>
      <p>Email: nezieljades@gmail.com</p>
      <p>Thank you for shopping with MyShop!</p>
    </section>

    <footer>
      <p>© 2026 MerryShop. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script src="script.js"></script>
    <script src="cart.js"></script>
  </body>
</html>
